{{define "main"}}
<section class="auth-card">
  <h1 class="auth-card__title">Sign in</h1>
  {{if .Data.SignedOut}}<p class="notice notice--info" role="status">You have been signed out.</p>{{end}}
  {{if .Data.Error}}<p class="notice notice--error" role="alert">{{.Data.Error}}</p>{{end}}
  {{if .Data.Password}}
  <form class="form" method="post" action="{{.Base}}login">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field">
      <label class="field__label" for="username">Username</label>
      <input class="field__input" id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label class="field__label" for="password">Password</label>
      <input class="field__input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="button button--ink" type="submit">Sign in</button>
  </form>
  {{end}}
  {{if .Data.OIDC}}
  <p class="auth-card__alt"><a class="button button--secondary" href="{{.Base}}auth/oidc/start{{if .Data.Next}}?next={{.Data.Next}}{{end}}">{{.Data.OIDCLabel}}</a></p>
  {{end}}
  {{if .Data.Register}}<p class="auth-card__alt"><a href="{{.Base}}register">Create an account</a></p>{{end}}
</section>
{{end}}
