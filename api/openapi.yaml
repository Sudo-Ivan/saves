            application/json:
              schema:
                type: object
                properties:
                  users: {type: integer}
                  used_bytes: {type: integer}
                  snapshots: {type: integer}
                  slots: {type: integer}
                  apps: {type: integer}
                  active_tokens: {type: integer}
                  active_sessions: {type: integer}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
  /v1/admin/gc:
    post:
      tags: [Admin]
      operationId: adminGC
      summary: Trigger a GC pass
      responses:
        '200': {description: gc report}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
