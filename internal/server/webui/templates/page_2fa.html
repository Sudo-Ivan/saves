{{define "main"}}
<section class="auth-card">
  <h1 class="auth-card__title">Two-factor authentication</h1>
  {{if .Data.Notice}}<p class="notice notice--info" role="status">{{.Data.Notice}}</p>{{end}}
  {{if .Data.Error}}<p class="notice notice--error" role="alert">{{.Data.Error}}</p>{{end}}
  <p>Enter the 6 digit code from your authenticator app, or one of your recovery codes.</p>
  <form class="form" method="post" action="{{.Base}}login/2fa">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <div class="field">
      <label class="field__label" for="code">Authentication code</label>
      <input class="field__input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" autofocus>
    </div>
    <div class="field">
      <label class="field__label" for="recovery">Recovery code</label>
      <input class="field__input" id="recovery" name="recovery" type="text" autocomplete="off" placeholder="xxxxx-xxxxx">
    </div>
    <button class="button button--ink" type="submit">Verify</button>
  </form>
</section>
{{end}}
