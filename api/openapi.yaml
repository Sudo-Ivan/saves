      parameters:
        - {$ref: '#/components/parameters/userId'}
      responses:
        '200':
          description: tokens
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Token'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
    post:
      tags: [Admin]
      operationId: adminCreateToken
      summary: Mint a token for a user
      parameters:
        - {$ref: '#/components/parameters/userId'}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TokenCreate'}
            example: {name: "admin issued", scopes: [read]}
      responses:
        '201':
          description: token shown once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenCreated'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
  /v1/admin/tokens/{id}:
    delete:
      tags: [Admin]
      operationId: adminRevokeToken
      summary: Revoke any token
      parameters:
        - {$ref: '#/components/parameters/userId'}
      responses:
        '200': {description: revoked}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
  /v1/admin/invites:
    get:
      tags: [Admin]
      operationId: adminInvites
      summary: List invites
      responses:
        '200':
          description: invites with computed status
          content:
            application/json:
              schema:
                type: array
                items: {type: object}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
    post:
      tags: [Admin]
      operationId: adminInviteCreate
      summary: Create an invite
      description: Returns the plain code once; only its hash is stored.
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteCreate'}
            example: {label: "beta testers", max_uses: 5}
      responses:
        '201':
          description: invite created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteCreated'}
              example: {id: "i1", code: "inv_a1b2c3d4"}
