openapi: 3.1.0
info:
  title: saves API
  version: "1.0"

servers:
  - url: https://{host}

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: sv1_ API token
  schemas:
    Problem:
      type: object
      properties:
        code: {type: string}
        title: {type: string}
        status: {type: integer}
    Manifest: {type: object}
    Snapshot: {type: object}

paths:
  /v1/me:
    get:
      operationId: me
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/register:
    post:
      operationId: register
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/vault:
    get:
      operationId: vaultGet
      responses:
        '200': {description: ok}
        '401': {description: auth}
    put:
      operationId: vaultPut
      responses:
        '200': {description: ok}
        '401': {description: auth}
    delete:
      operationId: vaultDelete
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/events:
    get:
      operationId: events
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps:
    get:
      operationId: apps
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots:
    get:
      operationId: slots
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}:
    get:
      operationId: slot
      responses:
        '200': {description: ok}
        '401': {description: auth}
    delete:
      operationId: slotDelete
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots:
    post:
      operationId: begin
      responses:
        '200': {description: ok}
        '401': {description: auth}
    get:
      operationId: listSnapshots
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{id}:
    get:
      operationId: getSnapshot
      responses:
        '200': {description: ok}
        '401': {description: auth}
    delete:
      operationId: deleteSnapshot
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{id}/commit:
    post:
      operationId: commit
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{id}/chunks/{hash}:
    put:
      operationId: putChunk
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{id}/files/{path}:
    get:
      operationId: getFile
      responses:
        '200': {description: ok}
        '401': {description: auth}
    head:
      operationId: headFile
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{id}/archive.tar:
    get:
      operationId: archive
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/slots/{slot}/snapshots/{a}/diff/{b}:
    get:
      operationId: diff
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/apps/{app}/chunks/{hash}:
    get:
      operationId: getChunk
      responses:
        '200': {description: ok}
        '401': {description: auth}
    head:
      operationId: headChunk
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/users:
    get:
      operationId: adminUsers
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/users/{id}:
    get:
      operationId: adminUser
      responses:
        '200': {description: ok}
        '401': {description: auth}
    patch:
      operationId: adminPatchUser
      responses:
        '200': {description: ok}
        '401': {description: auth}
    delete:
      operationId: adminDeleteUser
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/users/{id}/tokens:
    get:
      operationId: adminListTokens
      responses:
        '200': {description: ok}
        '401': {description: auth}
    post:
      operationId: adminCreateToken
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/tokens/{id}:
    delete:
      operationId: adminRevokeToken
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/stats:
    get:
      operationId: adminStats
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/admin/gc:
    post:
      operationId: adminGC
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/tokens:
    get:
      operationId: myTokens
      responses:
        '200': {description: ok}
        '401': {description: auth}
    post:
      operationId: myTokenCreate
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/tokens/{id}:
    get:
      operationId: myTokenGet
      responses:
        '200': {description: ok}
        '401': {description: auth}
    patch:
      operationId: myTokenPatch
      responses:
        '200': {description: ok}
        '400': {description: invalid name, expiry or allowed_cidrs}
        '401': {description: auth}
        '409': {description: token revoked}
    delete:
      operationId: myTokenRevoke
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/tokens/{id}/events:
    get:
      operationId: myTokenEvents
      responses:
        '200': {description: ok}
        '401': {description: auth}
  /v1/tokens/{id}/stats:
    get:
      operationId: myTokenStats
      responses:
        '200': {description: ok}
        '401': {description: auth}

  /v1/admin/settings:
    get:
      responses: {'200': {description: settings}}
    patch:
      responses: {'200': {description: updated}}
  /v1/admin/audit:
    get:
      responses: {'200': {description: audit events}}
  /v1/admin/invites:
    get:
      responses: {'200': {description: invites}}
    post:
      responses: {'201': {description: invite code}}
  /v1/admin/invites/{id}:
    delete:
      responses: {'200': {description: revoked}}
  /v1/admin/ip-blocks:
    get:
      responses: {'200': {description: ip blocks}}
    post:
      responses: {'200': {description: added}}
  /v1/admin/ip-blocks/{id}:
    delete:
      responses: {'200': {description: removed}}
  /v1/admin/users/{id}/ban:
    post:
      responses: {'200': {description: banned}}
  /v1/admin/users/{id}/unban:
    post:
      responses: {'200': {description: unbanned}}
  /v1/admin/users/{id}/approve:
    post:
      responses: {'200': {description: approved}}
  /v1/admin/users/{id}/reject:
    post:
      responses: {'200': {description: rejected}}
  /v1/admin/users/{id}/password:
    post:
      responses: {'200': {description: temporary password}}
