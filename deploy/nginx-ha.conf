events {}
http {
    upstream savesd { server savesd:8443; }
    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        location / { proxy_pass https://savesd; proxy_http_version 1.1; }
    }
}
# h3 passthrough: QUIC cannot terminate here; either NAT UDP :443
# directly to one backend per client or use stream{} with
# proxy_pass savesd:443 and hash $remote_addr consistent.
