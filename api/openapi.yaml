        '403': {$ref: '#/components/responses/Problem403'}
  /v1/admin/invites/{id}:
    delete:
      tags: [Admin]
      operationId: adminInviteRevoke
      summary: Revoke an invite
      parameters:
        - {$ref: '#/components/parameters/userId'}
      responses:
        '200': {description: revoked}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
  /v1/admin/ip-blocks:
    get:
      tags: [Admin]
      operationId: adminBlocks
      summary: List IP blocks
      responses:
        '200':
          description: blocks
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IPBlock'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
    post:
      tags: [Admin]
      operationId: adminBlockCreate
      summary: Add an IP block
      description: Refuses blocks covering the caller's own address or trusted proxies.
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IPBlock'}
            example: {cidr: "192.0.2.0/24", reason: "abuse"}
      responses:
        '200': {description: added}
        '400': {$ref: '#/components/responses/Problem404'}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
  /v1/admin/ip-blocks/{id}:
    delete:
      tags: [Admin]
      operationId: adminBlockDelete
      summary: Remove an IP block
      parameters:
        - {$ref: '#/components/parameters/userId'}
      responses:
        '200': {description: removed}
        '401': {$ref: '#/components/responses/Problem401'}
        '403': {$ref: '#/components/responses/Problem403'}
        '404': {$ref: '#/components/responses/Problem404'}
