{{define "main"}}
<section class="panel">
  <h1 class="panel__title">Users</h1>
  <table class="table">
    <thead><tr>
      <th class="table__head">ID</th><th class="table__head">Subject</th><th class="table__head">Tier</th>
      <th class="table__head">Disabled</th><th class="table__head num">Created</th>
    </tr></thead>
    <tbody>
    {{range .Data.Users}}
      <tr class="table__row">
        <td class="table__cell"><a href="{{$.Base}}admin/users/{{.ID}}">{{.ID}}</a></td>
        <td class="table__cell">{{.Subject}}</td>
        <td class="table__cell">{{.Tier}}</td>
        <td class="table__cell">{{.Disabled}}</td>
        <td class="table__cell num">{{fdate .CreatedAt}}</td>
      </tr>
    {{end}}
    </tbody>
  </table>
  {{if .Data.More}}<p><a class="button button--secondary" href="{{.Base}}admin/users?after={{.Data.After}}">Next page</a></p>{{end}}
</section>
{{end}}
